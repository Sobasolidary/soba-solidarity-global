
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    Set Password | SOBA Solidarity Global Group
  </title>

  <link rel="stylesheet" href="css/member.css">

  <style>
    /* SOBA branding */

    .soba-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .soba-emblem {
      width: 54px;
      height: 54px;
      object-fit: contain;
      background: white;
      padding: 4px;
      border-radius: 5px;
    }

    .soba-brand .brand {
      font-size: 20px;
      font-weight: bold;
    }

    .soba-brand .motto {
      font-size: 12px;
      margin-top: 5px;
    }

    @media (max-width: 600px) {
      .soba-emblem {
        width: 45px;
        height: 45px;
      }

      .soba-brand .brand {
        font-size: 16px;
      }
    }
  </style>

</head>

<body>

  <header>

    <div class="soba-brand">

      <img
        src="sasse-crest.png"
        alt="SASSE School Crest"
        class="soba-emblem"
      >

      <div>
        <div class="brand">
          SOBA Solidarity Global Group
        </div>

        <div class="motto">
          One Brotherhood, One Support System.
        </div>
      </div>

    </div>

    <a href="index.html">Home</a>

  </header>

  <main class="auth">

    <section class="panel">

      <h1>Create your password</h1>

      <p class="muted">
        Open this page using the personal invitation
        or password-reset email sent to you.
      </p>

      <div
        id="message"
        class="message"
        hidden
        role="status">
      </div>

      <form id="password-form" class="hidden">

        <label for="password">
          New password (minimum 12 characters)
        </label>

        <input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="12"
          required
        >

        <label for="confirm">
          Confirm new password
        </label>

        <input
          id="confirm"
          type="password"
          autocomplete="new-password"
          minlength="12"
          required
        >

        <button
          class="wide"
          id="save-button"
          type="submit">
          Save password
        </button>

      </form>

      <p>
        <a href="member-login.html">
          Back to login
        </a>
      </p>

    </section>

  </main>

  <footer>
    © SOBA Solidarity Global Group
  </footer>

  <script
    type="module"
    src="js/set-password.js">
  </script>

</body>
</html>
